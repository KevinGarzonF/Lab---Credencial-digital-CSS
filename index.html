<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credencial Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="contenedor">

    <div class="cedula">

      <div class="encabezado">
        <p class="pais">Credencial</p>
        <h1 class="nombre">Kevin Papitas</h1>
        <p class="rol">Desarrollador</p>
      </div>

      <div class="informacion">
        <div class="columna-izquierda">
          <img src="/img/foto provicional.png" alt="Foto de perfil" class="foto">
        </div>

        <div class="columna-derecha">
          <p class="etiqueta">Número</p>
          <p class="numero-cedula">
            <i class="fa-solid fa-thumbs-up"></i> 111.222.333
          </p>

          <p class="etiqueta">Ciudad</p>
          <p class="dato">
            <i class="fa-solid fa-location-dot"></i> Bogotá, Colombia
          </p>

          <p class="etiqueta">Correo</p>
          <p class="dato">
            <i class="fa-solid fa-envelope"></i> kevin.papitas@hotmail.com
          </p>

          <p class="etiqueta">Tecnología Favorita</p>
          <p class="dato">
            <i class="fa-solid fa-gears"></i> HTML y CSS
          </p>

          <p class="etiqueta">Hobby</p>
          <p class="dato">
            <i class="fa-solid fa-gamepad"></i> Videojuegos
          </p>

          <p class="etiqueta">Github</p>
          <p class="dato">
            <i class="fa-brands fa-github"></i> github.com/kevinpapitas
          </p>
        </div>
      </div>
      <div class="pie">
        <p>DOCUMENTO 100% original</p>
      </div>

    </div>

  </div>

</body>

</html>
